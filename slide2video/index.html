<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide2Video</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Slide2Video</h1><span>スライドを動画(WebM)に変換</span></header>
<main>
  <section id="editor">
    <div id="slides"></div>
    <button id="add">＋ スライド追加</button>
  </section>
  <section id="preview">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="controls">
      <button id="play">▶ プレビュー</button>
      <button id="export">⏺ 動画を書き出す</button>
      <span id="status"></span>
    </div>
    <a id="download" hidden>ダウンロード</a>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
