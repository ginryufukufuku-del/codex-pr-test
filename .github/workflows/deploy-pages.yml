name: Deploy medical-ai-search to GitHub Pages

on:
  push:
    branches:
      - claude/medical-ai-diagnosis-search-7vyev4
    paths:
      - "medical-ai-search/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: medical-ai-search

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
