name: Build Mac app

# 手動実行: GitHubの Actions タブ → 「Build Mac app」→ Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: video-ai-hub-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
