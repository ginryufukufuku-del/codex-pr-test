<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>APIキー設定</title>
<style>
body{font-family:system-ui,"Hiragino Sans",sans-serif;margin:20px;font-size:15px;color:#222}
h1{font-size:18px;margin:0 0 6px}p{color:#555;margin:4px 0 14px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;margin:10px 0}label{width:150px;font-weight:600}
input{flex:1;padding:6px;font:inherit;border:1px solid #bbb;border-radius:6px}
button{padding:6px 12px;font:inherit;border:1px solid #1565c0;background:#1565c0;color:#fff;border-radius:8px;cursor:pointer}
button.sub{background:#fff;color:#1565c0}.ok{color:#2e7d32;font-size:13px;width:70px}.no{color:#999;font-size:13px;width:70px}
</style></head><body>
<h1>APIキー設定</h1>
<p>キーはこのMacのキーチェーンで暗号化して保存し、画面には再表示しません。使うサービスのキーだけ入力してください。API生成は<b>有料</b>です。</p>
<div id="rows"></div>
<script>
const NAMES = [['GEMINI_API_KEY','Google Veo'],['RUNWAY_API_KEY','Runway'],['LUMA_API_KEY','Luma'],['FAL_KEY','fal.ai']];
async function draw() {
  const st = await window.keys.status();
  const box = document.getElementById('rows'); box.textContent = '';
  for (const [n, label] of NAMES) {
    const r = document.createElement('div'); r.className = 'row';
    const l = document.createElement('label'); l.textContent = label;
    const s = document.createElement('span'); s.className = st[n] ? 'ok' : 'no'; s.textContent = st[n] ? '設定済み' : '未設定';
    const i = document.createElement('input'); i.type = 'password'; i.placeholder = st[n] ? '(変更する場合のみ入力)' : 'キーを貼り付け'; i.autocomplete = 'off';
    const b = document.createElement('button'); b.textContent = '保存';
    b.onclick = async () => { if (i.value.trim()) { await window.keys.set(n, i.value.trim()); draw(); } };
    const c = document.createElement('button'); c.textContent = '削除'; c.className = 'sub';
    c.onclick = async () => { await window.keys.clear(n); draw(); };
    r.append(l, s, i, b, c); box.append(r);
  }
}
draw();
</script></body></html>
