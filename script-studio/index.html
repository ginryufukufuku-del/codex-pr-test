<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>脚本・絵コンテ スタジオ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 絵コンテ用紙。上部に尺メーター付きの固定ヘッダー、タブで工程を切替、コンテは「CUT/画面/内容/セリフ/秒」の用紙罫線で組む */
:root{
  --paper:#EEF2F4; --sheet:#FFFFFF; --ink:#17202A; --ink-2:#56636F; --rule:#D3DBE1; --rule-2:#B8C4CC;
  --blue:#2A75A8; --blue-soft:#DCEAF3; --red:#BE3B2B; --red-soft:#F6DFD9; --ochre:#9A6B0C; --ochre-soft:#F4E9CF; --ok:#2F7D4F;
  --b0:#2A75A8; --b1:#3C8C7E; --b2:#8A8A2E; --b3:#B07A1E; --b4:#B2533A; --b5:#8C4E86; --b6:#5464A8; --b7:#4F7A3A; --b8:#7A6A5A;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 0 rgba(23,32,42,.05),0 6px 20px -12px rgba(23,32,42,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11171D; --sheet:#182029; --ink:#E4E9ED; --ink-2:#9AA8B4; --rule:#2A3540; --rule-2:#3A4855;
  --blue:#7DB5DC; --blue-soft:#1C3242; --red:#EC7C6C; --red-soft:#3D221E; --ochre:#E0B455; --ochre-soft:#3A2F17; --ok:#7CC49A;
  --b0:#5A9FCC; --b1:#5DB3A3; --b2:#B5B54E; --b3:#D29A3E; --b4:#D9765C; --b5:#B577AE; --b6:#7F8ED1; --b7:#7FAA62; --b8:#A8968A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171D; --sheet:#182029; --ink:#E4E9ED; --ink-2:#9AA8B4; --rule:#2A3540; --rule-2:#3A4855;
  --blue:#7DB5DC; --blue-soft:#1C3242; --red:#EC7C6C; --red-soft:#3D221E; --ochre:#E0B455; --ochre-soft:#3A2F17; --ok:#7CC49A;
  --b0:#5A9FCC; --b1:#5DB3A3; --b2:#B5B54E; --b3:#D29A3E; --b4:#D9765C; --b5:#B577AE; --b6:#7F8ED1; --b7:#7FAA62; --b8:#A8968A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 260px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:.04em;white-space:nowrap}
.brand .ptitle{color:var(--ink-2);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.meter{display:flex;align-items:center;gap:10px;flex:0 1 340px;min-width:220px}
.meter .bar{flex:1;height:8px;background:var(--rule);border-radius:4px;position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:4px}
.meter .fill.over{background:var(--red)}.meter .fill.under{background:var(--ochre)}
.meter .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.85rem;white-space:nowrap}
.save{font-size:.75rem;color:var(--ink-2)}.save.err{color:var(--red)}
.top .tabs{display:flex;flex-wrap:nowrap;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px 9px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab small{font-family:var(--f-mono);font-size:.7rem;margin-right:6px;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.tab:hover{color:var(--ink)}

main{padding-block:22px 80px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0 0 4px;text-wrap:balance}
h3{font-size:.8rem;letter-spacing:.12em;color:var(--ink-2);font-weight:700;margin:0 0 8px;text-transform:uppercase}
.lead{color:var(--ink-2);margin:0 0 18px;max-width:68ch}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--ink-2);font-weight:500;min-width:0}
input[type=text],input[type=number],select,textarea{background:var(--sheet);border:1px solid var(--rule-2);border-radius:4px;padding:7px 9px;color:var(--ink);font-size:.92rem;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
input[type=range]{width:100%;accent-color:var(--blue)}
.btn{border:1px solid var(--rule-2);background:var(--sheet);padding:7px 13px;border-radius:4px;cursor:pointer;font-size:.88rem;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.btn.danger,.btn.danger:hover{background:var(--red);border-color:var(--red);color:var(--sheet)}
.btn.sm{padding:3px 8px;font-size:.78rem}
.btn.ghost{border-color:transparent;background:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;line-height:1.3;text-align:left}
.chip small{display:block;font-size:.7rem;color:var(--ink-2);font-family:var(--f-mono)}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--ink)}
.chip.med{border-style:dashed}
.note{font-size:.8rem;color:var(--ink-2)}
.warn{background:var(--ochre-soft);border-left:3px solid var(--ochre);padding:10px 12px;font-size:.85rem;border-radius:0 4px 4px 0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.dur{display:flex;align-items:baseline;gap:12px}
.dur .unit{color:var(--ink-2);font-size:.85rem}

/* structure bar */
.sbar{display:flex;height:30px;border-radius:4px;overflow:hidden;border:1px solid var(--rule)}
.sbar div{display:flex;align-items:center;justify-content:center;color:var(--sheet);font-size:.75rem;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap;padding:0 4px}
.beat{display:grid;grid-template-columns:14px minmax(0,1fr) 90px;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--rule)}
.beat:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:9px}
.beat .meta{font-size:.8rem;color:var(--ink-2);text-align:right}
.scn-list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.scn-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.85rem;padding:4px 8px;background:var(--paper);border-radius:4px}
.scn-row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp{height:6px;background:var(--rule);border-radius:3px;position:relative;margin-top:6px}
.cmp i{position:absolute;inset:0 auto 0 0;border-radius:3px}

/* characters */
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.cc{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c,var(--blue))}
.cc .h{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:8px}

/* storyboard */
.board{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.scenes{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.scenes .grp{padding:8px 12px 4px;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.scenes button.s{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px;width:100%;text-align:left;border:0;background:none;padding:7px 12px;cursor:pointer;font-size:.85rem;border-left:3px solid transparent}
.scenes button.s:hover{background:var(--paper)}
.scenes button.s[aria-current="true"]{background:var(--blue-soft);border-left-color:var(--blue)}
.scenes .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);min-width:0}
.sh-head{padding:16px;border-bottom:2px solid var(--ink);display:grid;gap:10px}
.sh-head .hrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr);gap:10px}
.hashira{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.cols{display:grid;grid-template-columns:64px minmax(180px,250px) minmax(0,1.3fr) minmax(0,1fr) 92px;border-bottom:1px solid var(--rule-2);font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--ink-2);background:var(--paper)}
.cols div{padding:6px 10px;border-left:1px solid var(--rule)}
.cols div:first-child{border-left:0}
.cut{display:grid;grid-template-columns:64px minmax(180px,250px) minmax(0,1.3fr) minmax(0,1fr) 92px;border-bottom:1px solid var(--rule-2)}
.cut>div{padding:10px;border-left:1px solid var(--rule);min-width:0;display:flex;flex-direction:column;gap:6px}
.cut>div:first-child{border-left:0}
.cno{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.cno small{display:block;font-weight:400;font-size:.7rem;color:var(--ink-2)}
.frame{position:relative;cursor:pointer;border:1.5px solid var(--ink);line-height:0;background:var(--sheet)}
.frame canvas{width:100%;height:auto;display:block}
.frame .pen{position:absolute;right:4px;bottom:4px;background:var(--sheet);border:1px solid var(--rule-2);border-radius:3px;font-size:.7rem;line-height:1.4;padding:1px 6px;opacity:.9}
.frame:hover{border-color:var(--blue)}
.sel4{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.sel4 select{font-size:.78rem;padding:4px 6px}
.tc{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.secin{font-family:var(--f-mono);text-align:right}
.ctools{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.addcut{padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sum-line{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--ink-2)}
.sum-line b{color:var(--ink);font-family:var(--f-mono);font-weight:600}

/* timeline */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.stats div{background:var(--sheet);padding:12px 14px}
.stats .k{font-size:.72rem;color:var(--ink-2);letter-spacing:.08em}
.stats .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.stats .v.over{color:var(--red)}.stats .v.under{color:var(--ochre)}.stats .v.ok{color:var(--ok)}
.tl-scroll{overflow-x:auto}
.tl{min-width:640px;position:relative}
.ruler{position:relative;height:22px;border-bottom:1px solid var(--rule-2);font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2)}
.ruler span{position:absolute;top:2px;transform:translateX(-50%)}
.ruler span:first-child{transform:none}.ruler span:first-child::after{left:0}
.ruler span.end{transform:translateX(-100%)}.ruler span.end::after{left:auto;right:0}
.ruler span::after{content:"";position:absolute;left:50%;top:14px;height:6px;border-left:1px solid var(--rule-2)}
.lane{display:flex;height:34px;margin-top:6px}
.lane button{border:0;border-right:1px solid var(--sheet);padding:0;cursor:pointer;min-width:1px;color:var(--sheet);font-family:var(--f-mono);font-size:.62rem;overflow:hidden}
.lane button:hover{filter:brightness(1.15)}
.lane.sc button{height:22px;opacity:.55}
.lane.target div{height:14px;border-right:1px solid var(--sheet);opacity:.35}
.lane-l{font-size:.7rem;color:var(--ink-2);margin-top:10px}
table.tt{width:100%;border-collapse:collapse;font-size:.85rem}
table.tt th,table.tt td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.tt th{font-size:.72rem;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
table.tt td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-scroll{overflow-x:auto}

/* script */
.script{font-family:var(--f-display);font-size:1rem;line-height:2;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:28px clamp(16px,5vw,56px);box-shadow:var(--shadow)}
.script.v{writing-mode:vertical-rl;height:72vh;overflow-x:auto;line-height:2.1}
.script .ttl{font-size:1.6rem;font-weight:800;margin:0 0 .4em}
.script .hs{font-weight:700;margin-top:1.4em}
.script .tg{padding-inline-start:3em;color:var(--ink)}
.script .dl{padding-inline-start:0}
.script .tr{text-align:end;color:var(--ink-2)}
.script.v .tr{text-align:end}
.script .sec{font-family:var(--f-body);font-size:.85rem;color:var(--ink-2);margin-top:1em}
.export{display:grid;gap:10px}
.refrow{display:grid;gap:8px;grid-template-columns:minmax(0,2fr) 90px 90px 100px auto;align-items:end;border-top:1px solid var(--rule);padding-top:10px}
.refrow .wide{grid-column:1/-1}
@media (max-width:640px){.refrow{grid-template-columns:1fr 1fr}.refrow>label:first-child{grid-column:1/-1}}
.export textarea{font-family:var(--f-mono);font-size:.78rem;min-height:220px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--sheet);border-radius:8px;max-width:1000px;width:100%;max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.mbox canvas{display:block;max-width:100%;max-height:62vh;margin:0 auto;border:1.5px solid var(--ink);touch-action:none;background:#fff}
.mbox select{width:auto}
.anim-cap{min-height:5.5em;font-size:.95rem}
.anim-cap .dlg{font-family:var(--f-display);font-size:1.1rem}
.prog{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);width:0}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-2);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:2px}

.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--rule);font-size:.88rem}
.checks input{margin-top:5px;accent-color:var(--blue)}

@media (max-width:900px){
  .board{grid-template-columns:minmax(0,1fr)}
  .scenes{position:static;max-height:240px}
  .cols{display:none}
  .cut{grid-template-columns:56px minmax(0,1fr) 88px;grid-template-areas:"no fr sec" "no ct ct" "no dl dl"}
  .cut>div:nth-child(1){grid-area:no}.cut>div:nth-child(2){grid-area:fr}.cut>div:nth-child(3){grid-area:ct;border-top:1px solid var(--rule)}
  .cut>div:nth-child(4){grid-area:dl;border-top:1px solid var(--rule)}.cut>div:nth-child(5){grid-area:sec}
  .sh-head .hrow{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .cut{grid-template-columns:minmax(0,1fr) 88px;grid-template-areas:"no sec" "fr fr" "ct ct" "dl dl"}
  .cut>div:nth-child(2){border-left:0;border-top:1px solid var(--rule)}
  .cut>div:nth-child(3),.cut>div:nth-child(4){border-left:0}
  .beat{grid-template-columns:14px minmax(0,1fr)}.beat .meta{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>脚本・絵コンテ スタジオ</h1><span class="ptitle" id="ptitle"></span></div>
    <div class="meter" title="合計尺 / 目標尺">
      <div class="bar"><div class="fill" id="mfill"></div></div>
      <span class="num" id="mnum"></span>
    </div>
    <div class="row"><button class="btn sm" data-act="anim">▶ プレビュー</button><span class="save" id="save"></span></div>
  </div>
  <nav class="wrap tabs" role="tablist" id="tabs"></nav>
</header>
<main class="wrap" id="main"></main>
<div class="modal" id="modal" hidden></div>

<script>
"use strict";
/* ============ 定数データ ============ */
const KEY = "script-studio.project.v1";
const FPS_OPTIONS = [24, 30];
const ASPECTS = { "16:9": 16/9, "9:16": 9/16, "1:1": 1, "2.39:1": 2.39, "4:3": 4/3 };

// asl = 平均カット長の目安（秒）。編集方針に合わせて変更可
const GENRES = [
  { id:"drama",   name:"ドラマ",            asl:5,   st:"kishotenketsu", en:"cinematic drama" },
  { id:"sf",      name:"SF",                asl:4,   st:"threeact",      en:"science fiction film" },
  { id:"fantasy", name:"ファンタジー",      asl:4.5, st:"threeact",      en:"fantasy film" },
  { id:"mystery", name:"ミステリー・サスペンス", asl:4, st:"threeact",   en:"suspense thriller" },
  { id:"horror",  name:"ホラー",            asl:3.5, st:"johakyu",       en:"horror film" },
  { id:"comedy",  name:"コメディ",          asl:4,   st:"kishotenketsu", en:"comedy" },
  { id:"romance", name:"恋愛",              asl:5.5, st:"kishotenketsu", en:"romance film" },
  { id:"action",  name:"アクション",        asl:2.5, st:"threeact",      en:"action film" },
  { id:"docu",    name:"ドキュメンタリー",  asl:6,   st:"docu",          en:"documentary", explainer:true },
  { id:"meddrama",name:"医療ドラマ",        asl:4.5, st:"threeact",      en:"medical drama", med:true },
  { id:"patient", name:"臨床医療・患者説明",asl:7,   st:"patient",       en:"medical patient education video", med:true, explainer:true },
  { id:"clinical",name:"医療者教育（症例・手技）", asl:8, st:"clinical", en:"clinical training video", med:true, explainer:true },
  { id:"edu",     name:"教育・解説",        asl:7,   st:"docu",          en:"educational explainer", explainer:true },
  { id:"webtalk", name:"ビジネス対談・ウェブ番組", asl:6, st:"talk", en:"web talk show interview", explainer:true, talk:true },
  { id:"debate",  name:"討論・ニュース番組", asl:5, st:"debate", en:"news debate program", explainer:true, talk:true },
  { id:"pr",      name:"企業PR・啓発",      asl:4,   st:"promo",         en:"corporate promotional film", explainer:true },
  { id:"cm",      name:"CM・プロモーション",asl:2.5, st:"promo",         en:"commercial" },
  { id:"mv",      name:"ミュージックビデオ",asl:2.5, st:"johakyu",       en:"music video" },
];

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r2 = v => Math.round(v * 2) / 2;
const G = id => GENRES.find(g => g.id === id) || GENRES[0];
const mmss = s => { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const secKoma = s => { const f = P.fps; let sec = Math.floor(s + 1e-9), k = Math.round((s - sec) * f); if (k >= f) { sec++; k = 0; } return sec + "+" + String(k).padStart(2, "0"); };
const tc = s => { const f = P.fps; const tot = Math.round(s * f); const fr = tot % f, ts = Math.floor(tot / f); return mmss(ts) + ":" + String(fr).padStart(2, "0"); };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const beatColor = i => `var(--b${i % 9})`;
const opts = (list, val) => list.map((o, i) => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(v) === String(val) ? " selected" : ""}>${esc(l)}</option>`; }).join("");

}

const sceneSec = s => s.cuts.reduce((a, c) => a + (+c.sec || 0), 0);
const totalSec = () => P.scenes.reduce((a, s) => a + sceneSec(s), 0);
const targetSec = () => P.durationMin * 60;
const findScene = id => P.scenes.find(s => s.id === id);
function findCut(id) { for (const s of P.scenes) { const c = s.cuts.find(c => c.id === id); if (c) return [c, s]; } return [null, null]; }
const beatIndex = id => Math.max(0, P.beats.findIndex(b => b.id === id));
function sceneNo(s) { return P.scenes.indexOf(s) + 1; }
function cutNumbers() { const m = {}; let n = 0; for (const s of P.scenes) for (const c of s.cuts) m[c.id] = ++n; return m; }
function cutStarts() { const m = {}; let t = 0; for (const s of P.scenes) for (const c of s.cuts) { m[c.id] = t; t += +c.sec || 0; } return m; }
function orderedScenes() { // ビート順に並べ替え（ビート内の順序は保持）
  const order = P.beats.map(b => b.id);
  return P.scenes.slice().sort((a, b) => (order.indexOf(a.beatId) - order.indexOf(b.beatId)) || (P.scenes.indexOf(a) - P.scenes.indexOf(b)));
}
function normalizeOrder() { P.scenes = orderedScenes(); }

/* ============ 自動下書き ============ */
function generate() {
  const st = STRUCTS[P.structure], dur = targetSec(), asl = clamp(+P.asl || 5, 1, 30);
  const pat = patternFor(G(P.genre));
  P.beats = st.beats.map(([name, purpose, pct]) => ({ id: uid(), name, purpose, pct }));
  const sceneLen = clamp(dur / 10, 30, 120);
  P.scenes = [];
  P.beats.forEach((b, bi) => {
    const bSec = dur * b.pct / 100, n = Math.max(1, Math.round(bSec / sceneLen));
    for (let i = 0; i < n; i++) {
      const sSec = bSec / n, nc = Math.max(1, Math.round(sSec / asl));
      const cuts = []; let acc = 0;
      for (let c = 0; c < nc; c++) {
        const end = r2((c + 1) * sSec / nc); const sec = Math.max(0.5, end - acc); acc += sec;
        cuts.push(makeCut(pat[c % pat.length], sec));
      }
      P.scenes.push({ id: uid(), beatId: b.id, place:"", time:"昼", transitionIn: (bi === 0 && i === 0) ? "F.I.（フェードイン）" : "カット",
        summary: `【${b.name}】${b.purpose}` + (n > 1 ? `（${i + 1}/${n}）` : ""), chars: P.characters.map(c => c.id).slice(0, 2), cuts });
    }
  });
  const last = P.scenes.at(-1)?.cuts.at(-1);
  if (last) { const diff = r2(dur - totalSec()); last.sec = Math.max(0.5, last.sec + diff); }
  ui.sceneId = P.scenes[0]?.id || null;
}

const PAPER = "#FFFFFF", INK = "#1B2430", NPB = "rgba(42,117,168,", RED = "#C2402F";

    drawFigure(ctx, x, top, H, lw);
    if (c.shot === "EWS" || c.shot === "LS") drawScenery(ctx, w, h, horizon, lw);

function line(ctx, a, b, c, d) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }
function drawFigure(ctx, cx, top, H, lw) {

function drawObject(ctx, cx, cy, w, h, lw) {

function drawScenery(ctx, w, h, hz, lw) {

function drawForeground(ctx, w, h, lw) {

/* ============ 01 企画 ============ */

  const g = G(P.genre), st = STRUCTS[P.structure];
  m.innerHTML = `
  <h2>企画</h2><p class="lead">ジャンル・世界観・尺・構成の型を決めると、構成とカット割りの下書きを自動で作れます。下書きは後から自由に書き換えられます。</p>
  <div class="grid2">
    <div class="panel stack">
      <label class="f">作品タイトル<input type="text" id="f-title" data-bind="title" value="${esc(P.title)}"></label>
      <label class="f">ログライン（一文のあらすじ）<textarea id="f-logline" rows="2" data-bind="logline" placeholder="〜な主人公が、〜によって、〜する物語">${esc(P.logline)}</textarea></label>
      <label class="f">テーマ（伝えたいこと）<input type="text" id="f-theme" data-bind="theme" value="${esc(P.theme)}"></label>
      <label class="f">対象視聴者<input type="text" id="f-aud" data-bind="audience" value="${esc(P.audience)}" placeholder="例：検査を予定している患者とその家族"></label>
      <div><h3>尺</h3>
        <div class="dur"><span class="big mono" id="durv">${P.durationMin}</span><span class="unit">分 ＝ <span id="durs">${P.durationMin * 60}</span>秒</span></div>
        <input type="range" id="f-dur" min="3" max="30" step="1" value="${P.durationMin}" data-bind="durationMin" aria-label="尺（分）">
        <div class="chips">${[3,5,10,15,20,30].map(n => `<button class="chip" aria-pressed="${P.durationMin === n}" data-act="set" data-k="durationMin" data-v="${n}">${n}分</button>`).join("")}</div>
      </div>
      <div class="grid2" style="gap:10px">
        <label class="f">画面比率<select id="f-aspect" data-bind="aspect">${opts(Object.keys(ASPECTS).map(k => [k, k + ({"9:16":"（縦型SNS）","2.39:1":"（シネスコ）"}[k] || "")]), P.aspect)}</select></label>
        <label class="f">フレームレート<select id="f-fps" data-bind="fps">${opts(FPS_OPTIONS.map(f => [f, f + " fps"]), P.fps)}</select></label>
      </div>
    </div>
    <div class="panel stack">
      <div><h3>ジャンル</h3><div class="chips">${GENRES.map(x => `<button class="chip${x.med ? " med" : ""}" aria-pressed="${x.id === P.genre}" data-act="genre" data-v="${x.id}">${esc(x.name)}<small>平均カット ${x.asl}秒</small></button>`).join("")}</div></div>
      <div><h3>世界観・タイプ</h3><div class="chips">${WORLDS.map(x => `<button class="chip" aria-pressed="${x === P.world}" data-act="set" data-k="world" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>
      <div><h3>トーン</h3><div class="chips">${TONES.map(x => `<button class="chip" aria-pressed="${x === P.tone}" data-act="set" data-k="tone" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>
    </div>
  </div>
  <div class="panel stack" style="margin-top:16px">
    <div class="grid2" style="gap:12px;align-items:end">
      <label class="f">話の構成（型）<select id="f-struct" data-bind="structure">${opts(Object.entries(STRUCTS).map(([k, v]) => [k, v.name]), P.structure)}</select></label>
      <label class="f">平均カット長（秒）<input type="number" id="f-asl" min="1" max="30" step="0.5" data-bind="asl" value="${P.asl}"></label>
    </div>
    <div class="sbar" id="sprev">${st.beats.map(([n, , pct], i) => `<div style="flex:${pct};background:${beatColor(i)}" title="${esc(n)} ${pct}%">${esc(n)}</div>`).join("")}</div>
    <p class="note" id="estim">${estimateText()}</p>
    <div class="row"><button class="btn primary" data-act="generate">構成と絵コンテの下書きを作る</button>
      <span class="note">今のシーンとカットは置き換わります（人物は残ります）。</span></div>
  </div>
  ${g.med ? `<div class="panel checks" style="margin-top:16px"><h3>医療コンテンツの確認リスト</h3>
    <p class="note" style="margin-top:0">公開前に確認してください。医療機関の広告に当たる場合は、厚生労働省の「医療広告ガイドライン」も確認が必要です。</p>
    ${MED_CHECKS.map(([k, t]) => `<label><input type="checkbox" id="chk-${k}" data-check="${k}"${P.checks[k] ? " checked" : ""}><span>${esc(t)}</span></label>`).join("")}</div>` : ""}`;
}
function estimateText() {
  const d = targetSec(), asl = +P.asl || 5, st = STRUCTS[P.structure];
  const sceneLen = clamp(d / 10, 30, 120);
  const scenes = st.beats.reduce((a, [, , pct]) => a + Math.max(1, Math.round(d * pct / 100 / sceneLen)), 0);
  return `目安：${st.beats.length}ブロック・約${scenes}シーン・約${Math.round(d / asl)}カット（${mmss(d)}、平均${asl}秒/カット）`;
}

/* ============ 02 人物 ============ */
function renderCast(m) {
  const roles = G(P.genre).med ? MED_ROLES.concat(ROLES.filter(r => !MED_ROLES.includes(r))) : ROLES;
  m.innerHTML = `<h2>登場人物</h2><p class="lead">役割、目的、口調を決めておくと、台詞の書き分けがしやすくなります。役割を押すとその役割の人物を追加します。</p>
  <div class="row" style="margin-bottom:16px">${roles.map(r => `<button class="btn sm" data-act="addchar" data-v="${esc(r)}">＋ ${esc(r)}</button>`).join("")}</div>
  ${P.characters.length ? "" : `<div class="warn">まだ人物がいません。上のボタンから追加してください。</div>`}
  <div class="cast">${P.characters.map(c => `
    <div class="cc" style="--c:${beatColor(c.color)}">
      <div class="h"><label class="f">名前<input type="text" id="cn-${c.id}" data-char="${c.id}" data-k="name" value="${esc(c.name)}"></label>
        <label class="f">年齢<input type="text" id="ca-${c.id}" data-char="${c.id}" data-k="age" value="${esc(c.age)}"></label></div>
      <label class="f">役割<select id="cr-${c.id}" data-char="${c.id}" data-k="role">${opts([...new Set([c.role, ...roles])].filter(Boolean), c.role)}</select></label>
      <label class="f">人物像<textarea id="cd-${c.id}" rows="2" data-char="${c.id}" data-k="desc">${esc(c.desc)}</textarea></label>
      <label class="f">目的・欲しいもの<input type="text" id="cg-${c.id}" data-char="${c.id}" data-k="goal" value="${esc(c.goal)}"></label>
      <label class="f">口調・話し方<input type="text" id="cs-${c.id}" data-char="${c.id}" data-k="speech" value="${esc(c.speech)}"></label>
      <div class="row" style="justify-content:space-between">
        <div class="row">${[0,1,2,3,4,5,6,7,8].map(i => `<button class="swatch" style="background:${beatColor(i)}" aria-label="色${i + 1}" aria-pressed="${c.color === i}" data-act="charcolor" data-id="${c.id}" data-v="${i}"></button>`).join("")}</div>
        <button class="btn sm ghost" data-act="delchar" data-id="${c.id}">削除</button></div>
    </div>`).join("")}</div>`;
}

/* ============ 03 構成 ============ */
function renderStructure(m) {
  normalizeOrder();
  const d = targetSec(), sumPct = P.beats.reduce((a, b) => a + (+b.pct || 0), 0);
  m.innerHTML = `<h2>構成</h2><p class="lead">ブロック（起承転結など）ごとの尺の配分と、各ブロックに入るシーンを管理します。色付きの線が実際の尺、薄い線が目標です。</p>
  ${P.beats.length ? "" : `<div class="warn">構成がありません。「企画」で下書きを作るか、下のボタンでブロックを追加してください。</div>`}
  <div class="panel">
    <div class="sbar" style="margin-bottom:6px">${P.beats.map((b, i) => `<div style="flex:${b.pct || .01};background:${beatColor(i)}">${esc(b.name)}</div>`).join("")}</div>
    <p class="note">配分の合計 <b class="mono">${sumPct}%</b>${Math.abs(sumPct - 100) > .5 ? `　<button class="btn sm" data-act="normpct">100%にそろえる</button>` : ""}</p>
    ${P.beats.map((b, i) => { const ss = P.scenes.filter(s => s.beatId === b.id); const act = ss.reduce((a, s) => a + sceneSec(s), 0), tg = d * (+b.pct || 0) / 100;
      const diff = act - tg;
      return `<div class="beat">
        <span class="dot" style="background:${beatColor(i)}"></span>
        <div class="stack" style="gap:6px;min-width:0">
          <div class="row" style="flex-wrap:nowrap"><input type="text" id="bn-${b.id}" data-beat="${b.id}" data-k="name" value="${esc(b.name)}" style="font-weight:700;max-width:180px">
            <input type="number" id="bp-${b.id}" data-beat="${b.id}" data-k="pct" value="${b.pct}" min="0" max="100" step="1" style="width:76px" aria-label="割合%"><span class="note">%</span></div>
          <input type="text" id="bu-${b.id}" data-beat="${b.id}" data-k="purpose" value="${esc(b.purpose)}" aria-label="役割">
          <div class="cmp"><i style="width:${Math.min(100, tg ? act / tg * 100 : 0)}%;background:${beatColor(i)}"></i></div>
          <div class="scn-list">${ss.map(s => `<div class="scn-row"><span class="mono">S${sceneNo(s)}</span><span class="t">○${esc(s.place || "（場所未定）")}（${esc(s.time)}）— ${esc(s.summary)}</span>
            <span class="row" style="gap:2px;flex-wrap:nowrap"><span class="mono note">${mmss(sceneSec(s))}</span>
            <button class="btn sm ghost" data-act="moveScene" data-id="${s.id}" data-v="-1" aria-label="上へ">↑</button><button class="btn sm ghost" data-act="moveScene" data-id="${s.id}" data-v="1" aria-label="下へ">↓</button>
            <button class="btn sm ghost" data-act="openScene" data-id="${s.id}">開く</button><button class="btn sm ghost" data-act="delScene" data-id="${s.id}">削除</button></span></div>`).join("")}
            <div><button class="btn sm" data-act="addScene" data-id="${b.id}">＋ シーン追加</button></div></div>
        </div>
        <div class="meta"><div class="mono">目標 ${mmss(tg)}</div><div class="mono" style="color:${Math.abs(diff) > Math.max(5, tg * .1) ? (diff > 0 ? "var(--red)" : "var(--ochre)") : "var(--ok)"}">実際 ${mmss(act)}</div>
          <button class="btn sm ghost" data-act="delBeat" data-id="${b.id}">ブロック削除</button></div>
      </div>`; }).join("")}
    <div class="row" style="margin-top:12px"><button class="btn sm" data-act="addBeat">＋ ブロック追加</button></div>
  </div>`;
}

/* ============ 04 絵コンテ ============ */
function renderBoard(m) {
  normalizeOrder();
  if (!P.scenes.length) { m.innerHTML = `<h2>絵コンテ</h2><div class="warn">シーンがありません。「企画」で下書きを作るか、「構成」でシーンを追加してください。</div>`; return; }
  if (!findScene(ui.sceneId)) ui.sceneId = P.scenes[0].id;
  const s = findScene(ui.sceneId), nums = cutNumbers(), starts = cutStarts();
  let lastBeat = null;
  const list = P.scenes.map(x => { const bi = beatIndex(x.beatId); const head = x.beatId !== lastBeat ? `<div class="grp"><span class="dot" style="margin:0;width:8px;height:8px;background:${beatColor(bi)}"></span>${esc(P.beats[bi]?.name || "")}</div>` : ""; lastBeat = x.beatId;
    return head + `<button class="s" data-act="openScene" data-id="${x.id}" aria-current="${x.id === s.id}"><span class="mono">S${sceneNo(x)}</span><span class="t">${esc(x.place || x.summary || "（未定）")}</span><span class="mono note" id="ls-${x.id}">${mmss(sceneSec(x))}</span></button>`; }).join("");
  const chars = P.characters;
  m.innerHTML = `<div class="board">
    <aside class="scenes" aria-label="シーン一覧">${list}</aside>
    <section class="sheet">
      <div class="sh-head">
        <div class="row" style="justify-content:space-between"><span class="hashira">S${sceneNo(s)}　○${esc(s.place || "場所")}（${esc(s.time)}）</span>
          <span class="sum-line"><span>カット <b id="sc-n">${s.cuts.length}</b></span><span>シーン尺 <b id="sc-t">${mmss(sceneSec(s))}</b></span><span>開始 <b>${tc(starts[s.cuts[0]?.id] ?? 0)}</b></span></span></div>
        <div class="hrow">
          <label class="f">場所（柱）<input type="text" id="sp-${s.id}" data-scene="${s.id}" data-k="place" value="${esc(s.place)}" placeholder="例：病院・診察室"></label>
          <label class="f">時間帯<select id="st-${s.id}" data-scene="${s.id}" data-k="time">${opts(TIMES, s.time)}</select></label>
          <label class="f">前のシーンからのつなぎ<select id="sx-${s.id}" data-scene="${s.id}" data-k="transitionIn">${opts(TRANS, s.transitionIn)}</select></label>
        </div>
        <div class="hrow" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
          <label class="f">シーンの内容（何が起き、何が変わるか）<textarea id="ss-${s.id}" rows="2" data-scene="${s.id}" data-k="summary">${esc(s.summary)}</textarea></label>
          <label class="f">ブロック<select id="sb-${s.id}" data-scene="${s.id}" data-k="beatId">${opts(P.beats.map(b => [b.id, b.name]), s.beatId)}</select></label>
        </div>
        ${chars.length ? `<div class="row"><span class="note">登場：</span>${chars.map(c => `<button class="chip" aria-pressed="${s.chars.includes(c.id)}" data-act="toggleChar" data-id="${s.id}" data-v="${c.id}">${esc(c.name || "（名前なし）")}</button>`).join("")}</div>` : ""}
      </div>
      <div class="cols" aria-hidden="true"><div>CUT</div><div>画面</div><div>内容（カメラ・ト書き）</div><div>セリフ・音</div><div>秒</div></div>
      ${s.cuts.map((c, i) => cutRow(c, i, s, nums, starts)).join("")}
      <div class="addcut"><button class="btn primary" data-act="addCut" data-id="${s.id}">＋ カットを追加</button>
        <span class="note">画面をクリックすると手描きできます。何も描かなければ、サイズ・アングル・構図から自動でラフを描きます。</span></div>
    </section></div>`;
}
function cutRow(c, i, s, nums, starts) {
  const sceneChars = P.characters.filter(ch => s.chars.includes(ch.id));
  return `<div class="cut" id="cut-${c.id}">
    <div><span class="cno">C${nums[c.id]}<small>S${sceneNo(s)}-${i + 1}</small></span><span class="tc" id="in-${c.id}">${tc(starts[c.id])}</span></div>
    <div><div class="frame" data-act="draw" data-id="${c.id}" role="button" tabindex="0" aria-label="C${nums[c.id]}の画面を描く"><canvas data-thumb="${c.id}"></canvas><span class="pen">${c.sketch ? "手描き" : "自動ラフ"} ✎</span></div>
      <div class="sel4">
        <select id="cs-${c.id}" data-cut="${c.id}" data-k="shot" aria-label="画面サイズ">${opts(SHOTS, c.shot)}</select>
        <select id="ca-${c.id}" data-cut="${c.id}" data-k="angle" aria-label="アングル">${opts(ANGLES, c.angle)}</select>
        <select id="cm-${c.id}" data-cut="${c.id}" data-k="move" aria-label="カメラワーク">${opts(MOVES, c.move)}</select>
        <select id="cp-${c.id}" data-cut="${c.id}" data-k="comp" aria-label="構図">${opts(COMPS, c.comp)}</select>
      </div></div>
    <div><label class="f">ト書き（画に映る動き・芝居）<textarea id="ct-${c.id}" rows="4" data-cut="${c.id}" data-k="action">${esc(c.action)}</textarea></label></div>
    <div><label class="f">セリフ（名前「台詞」）<textarea id="cd-${c.id}" rows="3" data-cut="${c.id}" data-k="dialogue">${esc(c.dialogue)}</textarea></label>
      ${sceneChars.length ? `<div class="row" style="gap:4px">${sceneChars.map(ch => `<button class="btn sm" data-act="insName" data-id="${c.id}" data-v="${esc(ch.name)}">${esc(ch.name)}</button>`).join("")}</div>` : ""}
      <label class="f">音（BGM・SE）<input type="text" id="cn-${c.id}" data-cut="${c.id}" data-k="sound" value="${esc(c.sound)}"></label></div>
    <div><input type="number" class="secin" id="cx-${c.id}" data-cut="${c.id}" data-k="sec" value="${c.sec}" min="0.5" max="600" step="0.5" aria-label="秒数">
      <span class="tc" id="sk-${c.id}">${secKoma(c.sec)}</span>
      <div class="ctools">
        <button class="btn sm ghost" data-act="moveCut" data-id="${c.id}" data-v="-1" aria-label="上へ">↑</button>
        <button class="btn sm ghost" data-act="moveCut" data-id="${c.id}" data-v="1" aria-label="下へ">↓</button>
        <button class="btn sm ghost" data-act="dupCut" data-id="${c.id}">複製</button>
        <button class="btn sm ghost" data-act="delCut" data-id="${c.id}">削除</button></div></div>
  </div>`;
}
function refreshBoardTimes() {
  const s = findScene(ui.sceneId); if (!s) return;
  const starts = cutStarts();
  P.scenes.forEach(x => { const el = document.getElementById("ls-" + x.id); if (el) el.textContent = mmss(sceneSec(x)); });
  s.cuts.forEach(c => { const a = document.getElementById("in-" + c.id), b = document.getElementById("sk-" + c.id); if (a) a.textContent = tc(starts[c.id]); if (b) b.textContent = secKoma(c.sec); });
  const t = $("#sc-t"); if (t) t.textContent = mmss(sceneSec(s));
}

/* ============ 05 タイムライン ============ */
function renderTimeline(m) {
  normalizeOrder();
  const t = totalSec(), g = targetSec(), diff = t - g, n = P.scenes.reduce((a, s) => a + s.cuts.length, 0);
  const span = Math.max(t, g) || 1, nums = cutNumbers(), starts = cutStarts();
  const step = span > 900 ? 120 : span > 400 ? 60 : span > 120 ? 30 : 15;
  const ticks = []; for (let x = 0; x <= span; x += step) ticks.push(x);
  const cls = Math.abs(diff) <= g * .03 ? "ok" : diff > 0 ? "over" : "under";
  const warns = [];
  if (cls === "over") warns.push(`目標より ${mmss(diff)} 長くなっています。カットを削るか、秒数を詰めてください。`);
  if (cls === "under") warns.push(`目標まで ${mmss(-diff)} 足りません。カットを追加するか、秒数を延ばしてください。`);
  const longCuts = []; P.scenes.forEach(s => s.cuts.forEach(c => { if (c.sec >= Math.max(15, (+P.asl || 5) * 3)) longCuts.push("C" + nums[c.id]); }));
  if (longCuts.length) warns.push(`長いカット（平均の3倍以上）：${longCuts.slice(0, 12).join("・")}${longCuts.length > 12 ? " ほか" : ""}。間延びしないか確認してください。`);
  const emptyDlg = P.scenes.filter(s => !s.place).length; if (emptyDlg) warns.push(`場所（柱）が未定のシーンが ${emptyDlg} 個あります。`);
  m.innerHTML = `<h2>タイムライン</h2><p class="lead">全カットを尺の比率で並べます。バーを押すとそのカットの絵コンテを開きます。</p>
  <div class="stats">
    <div><div class="k">合計尺</div><div class="v ${cls}">${mmss(t)}</div></div>
    <div><div class="k">目標尺</div><div class="v">${mmss(g)}</div></div>
    <div><div class="k">差</div><div class="v ${cls}">${diff >= 0 ? "+" : "−"}${mmss(Math.abs(diff))}</div></div>
    <div><div class="k">シーン / カット</div><div class="v">${P.scenes.length} / ${n}</div></div>
    <div><div class="k">平均カット長</div><div class="v">${n ? (t / n).toFixed(1) : "0"}秒</div></div>
  </div>
  ${warns.length ? `<div class="warn" style="margin-top:14px">${warns.map(esc).join("<br>")}</div>` : ""}
  <div class="panel" style="margin-top:16px"><div class="tl-scroll"><div class="tl">
    <div class="ruler">${ticks.map(x => `<span${x / span > .97 ? ' class="end"' : ""} style="left:${x / span * 100}%">${mmss(x)}</span>`).join("")}</div>
    <div class="lane-l">目標の配分</div>
    <div class="lane target">${P.beats.map((b, i) => `<div style="width:${g * (+b.pct || 0) / 100 / span * 100}%;background:${beatColor(i)}" title="${esc(b.name)}"></div>`).join("")}</div>
    <div class="lane-l">シーン</div>
    <div class="lane sc">${P.scenes.map(s => `<button style="width:${sceneSec(s) / span * 100}%;background:${beatColor(beatIndex(s.beatId))}" data-act="openScene" data-id="${s.id}" title="S${sceneNo(s)} ${esc(s.place)} ${mmss(sceneSec(s))}">S${sceneNo(s)}</button>`).join("")}</div>
    <div class="lane-l">カット</div>
    <div class="lane">${P.scenes.map(s => s.cuts.map(c => `<button style="width:${c.sec / span * 100}%;background:${beatColor(beatIndex(s.beatId))}" data-act="jumpCut" data-id="${c.id}" title="C${nums[c.id]} ${esc(c.shot)} ${c.sec}秒 ${esc(c.action)}"></button>`).join("")).join("")}</div>
  </div></div></div>
  <div class="panel" style="margin-top:16px"><h3>時間割（香盤）</h3><div class="tbl-scroll"><table class="tt">
    <thead><tr><th>シーン</th><th>ブロック</th><th>場所</th><th>内容</th><th>カット</th><th>IN</th><th>OUT</th><th>尺</th></tr></thead>

function normDialogue(line) {
  const l = line.trim(); if (!l) return null;
  if (/^[^「」：:]{1,20}「.*」?$/.test(l)) return { t: "dl", s: l };
  const m = l.match(/^([^：:「]{1,20})[：:]\s*(.+)$/); if (m) return { t: "dl", s: `${m[1]}「${m[2]}」` };
  return { t: "tg", s: l };
}
function scriptLines() {
  normalizeOrder();
  const out = [];
  const g = G(P.genre);
  out.push({ t: "ttl", s: `『${P.title}』` });
  out.push({ t: "sec", s: `${g.name}／${P.world}／${P.tone}／${P.durationMin}分（${P.aspect}・${P.fps}fps）` });
  if (P.logline) out.push({ t: "sec", s: `ログライン：${P.logline}` });
  if (P.theme) out.push({ t: "sec", s: `テーマ：${P.theme}` });
  if (P.characters.length) { out.push({ t: "hs", s: "登場人物" }); P.characters.forEach(c => out.push({ t: "tg", s: `${c.name}${c.age && c.age !== "—" ? `（${c.age}）` : ""}　${c.desc}` })); }
  P.scenes.forEach(s => {
    if (s.transitionIn && s.transitionIn !== "カット") out.push({ t: "tr", s: `（${s.transitionIn}）` });
    out.push({ t: "hs", s: `○${s.place || "（場所未定）"}（${s.time}）` });
    s.cuts.forEach(c => {
      if (c.action) out.push({ t: "tg", s: c.action });
      if (c.sound) out.push({ t: "tg", s: `〔${c.sound}〕` });
      (c.dialogue || "").split("\n").map(normDialogue).filter(Boolean).forEach(x => out.push(x));
    });
  });
  return out;
}
function scriptText() {
  return scriptLines().map(x => x.t === "tg" ? "　　　" + x.s : x.t === "hs" ? "\n" + x.s : x.t === "tr" ? "\n　　　　　　　　　　" + x.s : x.s).join("\n") + "\n";
}
function csvText() {
  const nums = cutNumbers(), starts = cutStarts();
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["カット","シーン","ブロック","場所","時間帯","画面サイズ","アングル","カメラワーク","構図","ト書き","セリフ","音","秒","秒+コマ","IN","OUT"]];
  P.scenes.forEach(s => s.cuts.forEach(c => rows.push([ "C" + nums[c.id], "S" + sceneNo(s), P.beats[beatIndex(s.beatId)]?.name, s.place, s.time,
    SHOTS.find(x => x[0] === c.shot)?.[1], c.angle, c.move, c.comp, c.action, c.dialogue, c.sound, c.sec, secKoma(c.sec), tc(starts[c.id]), tc(starts[c.id] + +c.sec) ])));
  return "﻿" + rows.map(r => r.map(q).join(",")).join("\r\n");
}
function promptText() {

  const lines = [`# ${P.title} — AI動画プロンプト（カット単位）`, `# style: ${g.en}, ${P.world}, tone ${P.tone}, aspect ${P.aspect}`, ""];

function chapterText() {
  normalizeOrder();

  rows.sort((a, b) => a[0] - b[0]);

  if (!rows.length || rows[0][0] !== 0) warn.push("最初のチャプターが0:00になっていません");

}

  else drawAuto(ctx, cv.width, cv.height, c);
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); drawState.undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (drawState.undo.length > 25) drawState.undo.shift();
    drawState.down = true; const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .01, y); stroke(e); });

    ctx.strokeStyle = drawState.eraser ? PAPER : drawState.color; ctx.stroke(); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); }
}

  delCut: (t, id) => { if (!armed(t, "もう一度")) return; const [c, s] = findCut(id); s.cuts = s.cuts.filter(x => x !== c); saveSoon(); render(); },
  moveCut: (t, id) => { const [c, s] = findCut(id); const i = s.cuts.indexOf(c), j = i + +t.dataset.v; if (j < 0 || j >= s.cuts.length) return; [s.cuts[i], s.cuts[j]] = [s.cuts[j], s.cuts[i]]; saveSoon(); render(); document.getElementById("cut-" + id)?.scrollIntoView({ block: "nearest" }); },
  insName: (t, id) => { const ta = document.getElementById("cd-" + id); const [c] = findCut(id); const ins = (ta.value && !ta.value.endsWith("\n") ? "\n" : "") + t.dataset.v + "「」";
    ta.value += ins; c.dialogue = ta.value; ta.focus(); ta.setSelectionRange(ta.value.length - 1, ta.value.length - 1); saveSoon(); },
  draw: (t, id) => openDraw(id),
  closeModal: () => closeModal(),
  pen: t => { drawState.color = t.dataset.v; drawState.eraser = false; document.querySelectorAll("[data-act=pen]").forEach(b => b.setAttribute("aria-pressed", b === t)); document.querySelector("[data-act=eraser]").setAttribute("aria-pressed", "false"); },
  eraser: t => { drawState.eraser = !drawState.eraser; t.setAttribute("aria-pressed", drawState.eraser); },
  undo: () => { const u = drawState.undo.pop(); if (u) drawState.ctx.putImageData(u, 0, 0); },
  autoBase: () => { const { ctx, cv, c } = drawState; drawState.undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); drawAuto(ctx, cv.width, cv.height, c); },
  clearDraw: () => { const { ctx, cv } = drawState; drawState.undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); ctx.fillStyle = PAPER; ctx.fillRect(0, 0, cv.width, cv.height); },
  saveDraw: () => { const { cv, c } = drawState; const o = document.createElement("canvas"); const w = P.aspect === "9:16" ? 360 : 640; o.width = w; o.height = Math.round(w * cv.height / cv.width);
    o.getContext("2d").drawImage(cv, 0, 0, o.width, o.height); c.sketch = o.toDataURL("image/jpeg", .82); closeModal(); save(); render(); },
  resetSketch: () => { drawState.c.sketch = ""; closeModal(); save(); render(); },
  anim: () => openAnim(),
  anPlay: t => { if (!anim) return; if (!anim.playing && anim.idx === anim.all.length - 1 && anim.t === 0) { anim.idx = 0; anim.show(); } anim.playing = !anim.playing; t.textContent = anim.playing ? "一時停止" : "再生"; },
  anPrev: () => { if (!anim) return; anim.idx = Math.max(0, anim.idx - 1); anim.t = 0; anim.show(); },
  anNext: () => { if (!anim) return; anim.idx = Math.min(anim.all.length - 1, anim.idx + 1); anim.t = 0; anim.show(); },
  addRef: () => { P.refs.push({ id: uid(), title: "", dur: 10, cuts: 0, notes: "" }); saveSoon(); render(); },
  delRef: (t, id) => { P.refs = P.refs.filter(r => r.id !== id); saveSoon(); render(); },
  vert: t => { ui.vertical = t.dataset.v === "1"; render(); },
  exp: t => { const v = t.dataset.v; const safe = (P.title || "project").replace(/[\\/:*?"<>|]/g, "_");
    const map = { script: [scriptText, `${safe}_脚本.txt`], csv: [csvText, `${safe}_絵コンテ.csv`], prompt: [promptText, `${safe}_AIプロンプト.txt`], chapters: [chapterText, `${safe}_チャプター.txt`], json: [() => JSON.stringify(P, null, 1), `${safe}.json`] };
    ui.exportText = map[v][0](); ui.exportName = map[v][1]; if (ui.tab !== "script") ui.tab = "script"; render(); document.getElementById("exp-out")?.scrollIntoView({ block: "nearest" }); },
  copy: () => { const ta = $("#exp-out"); if (!ta.value) return; const done = ok => { $("#exp-msg").textContent = ok ? "コピーしました" : "テキストを選択しました。Ctrl+C（⌘C）でコピーしてください"; };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(() => done(true), () => { ta.select(); done(false); }); else { ta.select(); done(false); } },
  download: () => { if (!ui.exportText) { $("#exp-msg").textContent = "先に書き出す内容を選んでください"; return; }
    const type = ui.exportName.endsWith(".csv") ? "text/csv" : ui.exportName.endsWith(".json") ? "application/json" : "text/plain";
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ui.exportText], { type: type + ";charset=utf-8" })); a.download = ui.exportName; document.body.appendChild(a); a.click(); a.remove();
    $("#exp-msg").textContent = `${ui.exportName} を保存しました（保存できない環境では「コピー」を使ってください）`; },
  sample: t => { if (!armed(t, "今の作品を置き換えます。もう一度")) return; P = t.dataset.v === "med" ? sampleMedical() : sampleSF(); ui.sceneId = P.scenes[0]?.id; ui.exportText = ""; save(); ui.tab = "setup"; render(); },
  newp: t => { if (!armed(t, "今の作品を消します。もう一度")) return; P = blankProject(); ui.sceneId = null; ui.exportText = ""; save(); ui.tab = "setup"; render(); },
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, t.dataset.id, e); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".frame")) { e.preventDefault(); openDraw(e.target.dataset.id); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

function readVal(el) { return el.type === "number" || el.type === "range" ? parseFloat(el.value) : el.value; }
function onEdit(e) {
  const el = e.target, d = el.dataset;
  if (el.id === "imp") return;
  if (d.check) { P.checks[d.check] = el.checked; saveSoon(); return; }
  let v = readVal(el);
  if ((el.type === "number" || el.type === "range") && !isFinite(v)) return;
  if (d.bind) {
    if (d.bind === "fps") v = +v;
    if (d.bind === "asl") v = clamp(v, 1, 30);
    P[d.bind] = v;
    if (d.bind === "durationMin") { $("#durv").textContent = v; $("#durs").textContent = v * 60; document.querySelectorAll('[data-k="durationMin"]').forEach(b => b.setAttribute("aria-pressed", +b.dataset.v === v)); }
    if (d.bind === "structure" && e.type === "change") { render(); }
    if (d.bind === "aspect" && e.type === "change") paintThumbs();
    const est = $("#estim"); if (est) est.textContent = estimateText();
  } else if (d.ref) { const r = P.refs.find(x => x.id === d.ref); if (!r) return; r[d.k] = v;
    const a = document.getElementById("ra-" + r.id); if (a) a.textContent = (r.cuts > 0 ? (r.dur * 60 / r.cuts).toFixed(1) : "—") + "秒"; saveSoon(); return;
  } else if (d.char) { const c = P.characters.find(x => x.id === d.char); if (c) c[d.k] = v; }
  else if (d.beat) { const b = P.beats.find(x => x.id === d.beat); if (b) b[d.k] = d.k === "pct" ? clamp(v, 0, 100) : v; if (d.k === "pct" && e.type === "change") render(); }
  else if (d.scene) { const s = findScene(d.scene); if (!s) return; s[d.k] = v;
    if (e.type === "change" && ["time", "beatId"].includes(d.k)) render();
    if (d.k === "place") { const h = document.querySelector(".hashira"); if (h) h.textContent = `S${sceneNo(s)}　○${s.place || "場所"}（${s.time}）`; } }
  else if (d.cut) { const [c] = findCut(d.cut); if (!c) return;
    if (d.k === "sec") { c.sec = clamp(r2(v) || .5, .5, 600); if (e.type === "change") el.value = c.sec; refreshBoardTimes(); }
    else c[d.k] = v;
    if (["shot", "angle", "move", "comp"].includes(d.k) && !c.sketch) { const cv = document.querySelector(`canvas[data-thumb="${c.id}"]`); if (cv) paintFrame(cv, c); } }
  else return;
  updateMeter(); saveSoon();
}
document.addEventListener("input", onEdit);
document.addEventListener("change", e => {
  if (e.target.id === "imp") {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || !Array.isArray(o.scenes)) throw new Error();
        P = migrate(o); ui.sceneId = P.scenes[0]?.id; save(); ui.tab = "setup"; render(); setSave(`「${f.name}」を読み込みました`, false); }
      catch (err) { setSave("読み込めませんでした。このアプリで書き出したJSONか確認してください", true); } };
    rd.readAsText(f); return;
  }
  onEdit(e);
});

/* ============ 起動 ============ */
P = load();
ui.sceneId = P.scenes[0]?.id || null;
render();
setSave("このブラウザに自動保存", false);
</script>
</body>
</html>
