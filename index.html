<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="今日やることを手軽に管理できるタスクアプリ" />
    <title>今日のタスク</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="task-card" aria-labelledby="app-title">
        <header class="app-header">
          <p class="eyebrow">MY DAY</p>
          <h1 id="app-title">今日のタスク</h1>
          <p class="subtitle">小さな一歩を、ひとつずつ。</p>
        </header>

        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">新しいタスク</label>
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="80"
            placeholder="何をしますか？"
            autocomplete="off"
            required
          />
          <button type="submit">追加</button>
        </form>

        <div class="task-summary" aria-live="polite">
          <span id="remaining-count">タスクはありません</span>
          <button id="clear-completed" class="text-button" type="button">
            完了済みを削除
          </button>
        </div>

        <ul id="task-list" class="task-list" aria-label="タスク一覧"></ul>

        <div id="empty-state" class="empty-state">
          <span aria-hidden="true">✓</span>
          <p>新しいタスクを追加してみましょう。</p>
        </div>
      </section>
    </main>

    <template id="task-template">
      <li class="task-item">
        <label>
          <input class="task-toggle" type="checkbox" />
          <span class="custom-checkbox" aria-hidden="true"></span>
          <span class="task-title"></span>
        </label>
        <button class="delete-button" type="button" aria-label="タスクを削除">×</button>
      </li>
    </template>

    <script src="task-store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
