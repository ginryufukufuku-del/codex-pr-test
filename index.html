<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外来説明ビジュアル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>外来説明ビジュアル</h1>
  <button id="toggleEdit" class="hbtn">⚙ 設定(追加・編集)</button>
</header>
<main>
  <nav id="diseases" aria-label="疾患"></nav>
  <section id="tools" hidden>
    <b>設定モード</b>
    <input id="newDisease" placeholder="新しい疾患名" size="14">
    <button id="addDisease">疾患を追加</button>
    <button id="exportBtn">保存(ファイル出力)</button>
    <button id="importBtn">読込</button>
    <button id="resetBtn">初期データに戻す</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <p class="hint">変更はこのブラウザに自動保存されます。別のPCで使うには「保存」したファイルを「読込」してください。</p>
  </section>
  <section id="detail" hidden></section>
</main>
<footer>※「要確認」のリンクは、内容を確認して「確認済み」にチェックするまで表示されます。</footer>
<script src="app.js"></script>
</body>
</html>
